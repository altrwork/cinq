name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in app/cli/cinq.mjs app/web/app.js app/worker/src/*.js app/worker/src/lander/server.cjs; do node --check "$f"; done
      - name: Unit tests (engine, lander, security)
        run: npm test
