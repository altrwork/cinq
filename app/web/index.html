<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cinq</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <symbol id="i-pair" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--ok)"/><circle cx="6.3" cy="8" r="2" fill="none" stroke="var(--bg)" stroke-width="1.4"/><circle cx="9.7" cy="8" r="2" fill="none" stroke="var(--bg)" stroke-width="1.4"/></symbol>
    <symbol id="i-rebuilt" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--ok)"/><path d="M10.8 6.2A3.2 3.2 0 0 0 5 6.6M5.2 9.8A3.2 3.2 0 0 0 11 9.4" fill="none" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round"/><path d="M10.9 4.4v1.9H9M5.1 11.6V9.7H7" fill="none" stroke="var(--bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="var(--bad)"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-hold" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--amber)"/><path d="M6.2 5.2v5.6M9.8 5.2v5.6" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-ring" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--fg-3)" stroke-width="1.4"/></symbol>
    <symbol id="i-work" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--fg-2)" stroke-width="1.5" stroke-dasharray="3 2.4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="var(--fg-2)" stroke-width="1.3"/><circle cx="8" cy="8" r="1.8" fill="var(--fg-2)"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.8 4.2c0-.7.5-1.2 1.2-1.2h3.2l1.4 1.6H13c.7 0 1.2.5 1.2 1.2v6.2c0 .7-.5 1.2-1.2 1.2H3c-.7 0-1.2-.5-1.2-1.2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 16 16"><path d="M4 1.8h5.2L12.5 5v9.2H4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 2v3.2h3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="i-code" viewBox="0 0 16 16"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-live" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2" fill="currentColor"/><path d="M4.4 4.4a5 5 0 0 0 0 7.2M11.6 4.4a5 5 0 0 1 0 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
    <symbol id="i-jobs" viewBox="0 0 16 16"><path d="M5.5 4h8M5.5 8h8M5.5 12h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M2 4l.8.8L4 3.5M2 8l.8.8L4 7.5M2 12l.8.8L4 11.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 16 16"><path d="M8 1.8l5 2v4c0 3-2.2 5.2-5 6.4-2.8-1.2-5-3.4-5-6.4v-4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 16 16"><path d="M4 2h8v12l-2-1.2L8 14l-2-1.2L4 14z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6 5.5h4M6 8h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>

<header class="top">
  <div class="wrap">
    <a class="logo" data-route="" aria-label="cinq"><img src="/cinq-lockup.svg" alt="cinq" height="20"></a>
    <span class="slash">/</span><a class="repo" id="repo-name" data-route="">…</a>
    <span class="chip">on Cloudflare Artifacts</span>
    <div class="right">
      <span class="conn" id="conn" title="Connection to live updates"><span class="d"></span><span id="conn-t">Connecting</span></span>
      <button class="ghost" id="theme" type="button" aria-label="Switch theme"><svg width="14" height="14"><use href="#i-sun"/></svg></button>
    </div>
  </div>
</header>
<div class="tabsbar" id="tabs">
  <div class="wrap">
    <nav aria-label="Repository">
      <a data-route="" data-tab="code"><svg width="16" height="16"><use href="#i-code"/></svg>Code</a>
      <a data-route="live" data-tab="live"><svg width="16" height="16"><use href="#i-live"/></svg>Live</a>
      <a data-route="why" data-tab="why"><svg width="16" height="16"><use href="#i-file"/></svg>Why is this here?</a>
      <a data-route="rules" data-tab="rules"><svg width="16" height="16"><use href="#i-shield"/></svg>House rules</a>
      <a data-route="jobs" data-tab="jobs"><svg width="16" height="16"><use href="#i-jobs"/></svg>Jobs<span class="n" id="n-jobs"></span></a>
    </nav>
  </div>
</div>
<main id="view" class="wrap" aria-live="polite">
  <div class="loading"><span class="dot idle"></span>Loading the project…</div>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
